# Fails (red X) when anyone other than AXO or AugmentedMagic changes main_levels/.
# It runs on every pull request (and passes when main_levels/ isn't touched), so it can
# be made a required check in the branch protection for main.
name: Protect main levels

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-editor:
    runs-on: ubuntu-latest
    steps:
      - name: Only AXO and AugmentedMagic may edit main_levels/
        env:
          # GitHub usernames allowed to change main_levels/ (space separated) -
          # the same names as the /main_levels/ line in .github/CODEOWNERS.
          ALLOWED: "AXO123456 adventure-car"
          WHO: ${{ github.event.pull_request.user.login || github.actor }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -n "$PR" ]; then
            gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > changed.txt
          else
            gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename' \
              > changed.txt 2>/dev/null || true
          fi
          if ! grep -q '^main_levels/' changed.txt; then
            echo "main_levels/ isn't changed - nothing to check"
            exit 0
          fi
          for name in $ALLOWED; do
            if [ "${name,,}" = "${WHO,,}" ]; then
              echo "$WHO may edit main_levels/"
              exit 0
            fi
          done
          echo "::error::$WHO is not allowed to change main_levels/ (only AXO and AugmentedMagic)"
          exit 1
